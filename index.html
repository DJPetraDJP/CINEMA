<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
    <title>Open Air Cinema</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        #title, #movie-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            color: #ffffff; font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.95), 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none; z-index: 100;
            -webkit-text-stroke: 1.5px rgba(0,0,0,0.6); white-space: nowrap;
        }
        #title { top: 20px; font-size: 8.2vw; letter-spacing: 4px; }
        #movie-title { top: 95px; font-size: 5.2vw; letter-spacing: 2.5px; }
        #controls {
            position: absolute; bottom: 20px; left: 20px; z-index: 100;
            display: grid; grid-template-columns: 60px 60px 60px; gap: 8px;
        }
        .btn {
            width: 60px; height: 60px; background: rgba(255,255,255,0.25);
            color: white; border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px; font-size: 32px;
            display: flex; align-items: center; justify-content: center;
        }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>
    <div id="title">OPEN AIR CINEMA</div>
    <div id="movie-title">DANCE NOW</div>
    <div id="controls">
        <div></div><div class="btn" id="up">↑</div><div></div>
        <div class="btn" id="left">←</div>
        <div class="btn" id="down">↓</div>
        <div class="btn" id="right">→</div>
    </div>
    <script>
    const audioURL = "https://raw.githubusercontent.com/DJPetraDJP/CINEMA/main/signal.mp3";
    const videoURL = "https://raw.githubusercontent.com/DJPetraDJP/CINEMA/main/Ddjjpp.mp4";

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x88aaff, 40, 150);
    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    scene.background = new THREE.Color(0x88aaff);

    const sun = new THREE.DirectionalLight(0xffeecc, 1.2);
    sun.position.set(25, 60, 30);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xaaccff, 0.7));

    const sand = new THREE.Mesh(new THREE.PlaneGeometry(150, 150), new THREE.MeshLambertMaterial({ color: 0xe0c090 }));
    sand.rotation.x = -Math.PI / 2;
    scene.add(sand);

    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(80, 60), new THREE.MeshLambertMaterial({ color: 0x0088dd, transparent: true, opacity: 0.85 }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.set(-35, 0.2, -10);
    scene.add(ocean);

    function createPinkTree(x, z) {
        const group = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 7, 8), new THREE.MeshLambertMaterial({ color: 0x8B5A2B }));
        trunk.position.y = 3.5;
        const foliage = new THREE.Mesh(new THREE.SphereGeometry(4.5, 10, 10), new THREE.MeshLambertMaterial({ color: 0xff69b4 }));
        foliage.position.y = 9;
        group.add(trunk); group.add(foliage);
        group.position.set(x, 0, z);
        scene.add(group);
    }
    createPinkTree(-18, -15); createPinkTree(22, -18); createPinkTree(-25, 5);

    function createSofa(x, z) {
        const sofa = new THREE.Group();
        const base = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.8, 2.2), new THREE.MeshLambertMaterial({ color: 0xff69b4 }));
        base.position.y = 0.9; sofa.add(base);
        const back = new THREE.Mesh(new THREE.BoxGeometry(4.8, 1.8, 0.5), new THREE.MeshLambertMaterial({ color: 0xff4d94 }));
        back.position.set(0, 1.8, -0.8); sofa.add(back);
        sofa.rotation.y = Math.PI;
        sofa.position.set(x, 0, z);
        scene.add(sofa);
    }
    createSofa(-10, 12); createSofa(10, 13); createSofa(-12, 20); createSofa(12, 21); createSofa(0, 17);

    const video = document.createElement('video');
    video.src = videoURL;
    video.crossOrigin = 'anonymous';
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';

    const videoTexture = new THREE.VideoTexture(video);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;
    videoTexture.format = THREE.RGBFormat;

    const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(24, 13.5),
        new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide })
    );
    screen.position.set(0, 8.5, -32);
    scene.add(screen);

    camera.position.set(0, 6, 25);

    const ufo = new THREE.Group();
    const ufoPink = new THREE.MeshLambertMaterial({ color: 0xff66aa });
    const ufoPinkDark = new THREE.MeshLambertMaterial({ color: 0xee4488 });
    const ufoDomeMat = new THREE.MeshLambertMaterial({ color: 0xffccee, transparent: true, opacity: 0.9 });
    const ufoLightMat = new THREE.MeshBasicMaterial({ color: 0xffff66 });
    ufo.add(new THREE.Mesh(new THREE.CylinderGeometry(3.2, 4.0, 0.55, 28), ufoPink));
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(4.0, 4.3, 0.25, 28), ufoPinkDark);
    rim.position.y = -0.35; ufo.add(rim);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(1.6, 18, 14, 0, Math.PI * 2, 0, Math.PI / 2), ufoDomeMat);
    dome.position.y = 0.28; ufo.add(dome);
    const ufoAnt = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.7, 6), new THREE.MeshLambertMaterial({ color: 0xff99cc }));
    ufoAnt.position.y = 1.9; ufo.add(ufoAnt);
    const ufoAntBall = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffee55 }));
    ufoAntBall.position.y = 2.3; ufo.add(ufoAntBall);
    const ufoLights = [];
    for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        const light = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), ufoLightMat);
        light.position.set(Math.cos(a) * 3.6, -0.5, Math.sin(a) * 3.6);
        ufo.add(light); ufoLights.push(light);
    }
    const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 1.8, 3.5, 16, 1, true),
        new THREE.MeshBasicMaterial({ color: 0xffaadd, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
    );
    beam.position.y = -2.2; ufo.add(beam);
    ufo.position.set(0, 2.5, 0);
    scene.add(ufo);
    let ufoTime = 0;

    // BLUE ROBOT — eyes/tray on local +Z = front
    const blueRobot = new THREE.Group();
    const blueMat = new THREE.MeshLambertMaterial({ color: 0x2299ff });
    const blueDark = new THREE.MeshLambertMaterial({ color: 0x1166cc });
    const bBody = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.6, 0.8), blueMat);
    bBody.position.y = 1.7; blueRobot.add(bBody);
    const bHead = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.0, 0.85), blueMat);
    bHead.position.y = 2.9; blueRobot.add(bHead);
    function makeBlueEye(x) {
        const eg = new THREE.Group();
        const w = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 10), new THREE.MeshLambertMaterial({ color: 0xffffff }));
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 8), new THREE.MeshLambertMaterial({ color: 0x111111 }));
        p.position.z = 0.16; eg.add(w); eg.add(p);
        eg.position.set(x, 2.95, 0.42); blueRobot.add(eg);
    }
    makeBlueEye(-0.26); makeBlueEye(0.26);
    const bAnt = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 6), blueDark);
    bAnt.position.y = 3.55; blueRobot.add(bAnt);
    const bAntBall = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0x66ffff }));
    bAntBall.position.y = 3.8; blueRobot.add(bAntBall);
    const bArmL = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.0, 0.28), blueDark);
    bArmL.position.set(-0.85, 1.8, 0); blueRobot.add(bArmL);
    const bArmR = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.0, 0.28), blueDark);
    bArmR.position.set(0.85, 1.8, 0); blueRobot.add(bArmR);
    const bTray = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 1.1), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    bTray.position.set(0, 2.15, 0.8); blueRobot.add(bTray);
    const treatColors = [0xff6688, 0xffcc44, 0x88ffaa, 0xff8844, 0xcc88ff];
    for (let i = 0; i < 5; i++) {
        const treat = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.17, 0.22, 10), new THREE.MeshLambertMaterial({ color: treatColors[i] }));
        treat.position.set(-0.55 + i * 0.28, 2.35, 0.65); blueRobot.add(treat);
        const top = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), new THREE.MeshLambertMaterial({ color: 0xffffff }));
        top.position.set(-0.55 + i * 0.28, 2.5, 0.65); top.scale.y = 0.5; blueRobot.add(top);
    }
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.38, 8), new THREE.MeshLambertMaterial({ color: 0xe8b060 }));
    cone.position.set(0.55, 2.4, 0.95); cone.rotation.x = Math.PI; blueRobot.add(cone);
    const scoop = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), new THREE.MeshLambertMaterial({ color: 0xff99cc }));
    scoop.position.set(0.55, 2.65, 0.95); blueRobot.add(scoop);
    const bLegL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, 0.4), blueDark);
    bLegL.position.set(-0.35, 0.75, 0); blueRobot.add(bLegL);
    const bLegR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, 0.4), blueDark);
    bLegR.position.set(0.35, 0.75, 0); blueRobot.add(bLegR);
    const bWheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    for (const wx of [-0.35, 0.35]) {
        for (let wi = 0; wi < 3; wi++) {
            const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.1, 8), bWheelMat);
            wh.rotation.z = Math.PI / 2;
            wh.position.set(wx, 0.12, -0.22 + wi * 0.22);
            blueRobot.add(wh);
        }
    }
    blueRobot.position.set(8, 0, 10);
    scene.add(blueRobot);
    let blueTime = 0;
    let bluePrevX = 8, bluePrevZ = 10;

    // PINK ROBOT
    const robot = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0xff3366 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.4, 0.7), bodyMat);
    body.position.y = 1.5; robot.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.85, 0.75), bodyMat);
    head.position.y = 2.55; robot.add(head);
    const eyeWhiteMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const eyePupilMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    function makeEye(x) {
        const eyeGroup = new THREE.Group();
        const white = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), eyeWhiteMat);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 10), eyePupilMat);
        pupil.position.z = 0.14; eyeGroup.add(white); eyeGroup.add(pupil);
        eyeGroup.position.set(x, 2.6, 0.38); robot.add(eyeGroup);
    }
    makeEye(-0.22); makeEye(0.22);
    const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.35, 6), new THREE.MeshLambertMaterial({ color: 0xff6699 }));
    antenna.position.y = 3.15; robot.add(antenna);
    const antennaBall = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshLambertMaterial({ color: 0xffcc00 }));
    antennaBall.position.y = 3.35; robot.add(antennaBall);
    const armMat = new THREE.MeshLambertMaterial({ color: 0xff4477 });
    const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.25), armMat);
    leftArm.position.set(-0.75, 1.6, 0); robot.add(leftArm);
    const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.25), armMat);
    rightArm.position.set(0.75, 1.6, 0); robot.add(rightArm);
    const tray = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 1.0), new THREE.MeshLambertMaterial({ color: 0xdddddd }));
    tray.position.set(0, 1.95, 0.7); robot.add(tray);
    const glassColors = [0xff4444, 0x44ff88, 0x4488ff, 0xffaa00, 0xff66cc];
    for (let i = 0; i < 5; i++) {
        const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.35, 10), new THREE.MeshLambertMaterial({ color: glassColors[i], transparent: true, opacity: 0.85 }));
        glass.position.set(-0.55 + i * 0.28, 2.18, 0.55); robot.add(glass);
        const liquid = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.04, 8), new THREE.MeshLambertMaterial({ color: glassColors[i] }));
        liquid.position.set(-0.55 + i * 0.28, 2.28, 0.55); robot.add(liquid);
    }
    const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.18, 12), new THREE.MeshLambertMaterial({ color: 0xf5d0a0 }));
    bowl.position.set(0.45, 2.12, 0.85); robot.add(bowl);
    const chipMat = new THREE.MeshLambertMaterial({ color: 0xffcc44 });
    for (let i = 0; i < 8; i++) {
        const chip = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.025, 8), chipMat);
        const angle = (i / 8) * Math.PI * 2;
        chip.position.set(0.45 + Math.cos(angle) * 0.12, 2.22 + (i % 3) * 0.03, 0.85 + Math.sin(angle) * 0.12);
        chip.rotation.x = Math.random() * 0.5; chip.rotation.z = Math.random() * 0.5;
        robot.add(chip);
    }
    const legMat = new THREE.MeshLambertMaterial({ color: 0xee2255 });
    const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.35), legMat);
    leftLeg.position.set(-0.3, 0.7, 0); robot.add(leftLeg);
    const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.35), legMat);
    rightLeg.position.set(0.3, 0.7, 0); robot.add(rightLeg);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const bootMat = new THREE.MeshLambertMaterial({ color: 0xff6699 });
    function makeRollerblade(x) {
        const blade = new THREE.Group();
        const boot = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.25, 0.7), bootMat);
        boot.position.y = 0.15; blade.add(boot);
        for (let i = 0; i < 4; i++) {
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.08, 10), wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(0, -0.05, -0.25 + i * 0.18);
            blade.add(wheel);
        }
        blade.position.set(x, 0.1, 0); robot.add(blade); return blade;
    }
    const leftBlade = makeRollerblade(-0.3);
    const rightBlade = makeRollerblade(0.3);
    robot.position.set(5, 0, 8);
    scene.add(robot);

    let robotTime = 0;
    const robotCenterX = 5, robotCenterZ = 8;
    const PHASE_CIRCLE = 0, PHASE_FORWARD_BACK = 1, PHASE_LEFT_RIGHT = 2;
    const phaseDuration = 8;

    let yaw = 0, isDragging = false, prevX = 0;
    renderer.domElement.addEventListener('touchstart', e => {
        if (e.touches.length === 1) { isDragging = true; prevX = e.touches[0].clientX; }
    });
    renderer.domElement.addEventListener('touchmove', e => {
        if (isDragging) {
            yaw -= (e.touches[0].clientX - prevX) * 0.0038;
            camera.rotation.set(0, yaw, 0);
            prevX = e.touches[0].clientX;
        }
    });
    renderer.domElement.addEventListener('touchend', () => isDragging = false);

    let moveF = false, moveB = false, moveL = false, moveR = false;
    const speed = 0.24;
    function btn(id, dir) {
        document.getElementById(id).addEventListener('touchstart', e => { e.preventDefault(); dir(true); });
        document.getElementById(id).addEventListener('touchend', e => { e.preventDefault(); dir(false); });
    }
    btn('up', v => moveF = v); btn('down', v => moveB = v);
    btn('left', v => moveL = v); btn('right', v => moveR = v);

    let playing = false;
    const audio = new Audio();
    audio.src = audioURL; audio.loop = true; audio.preload = 'auto'; audio.crossOrigin = 'anonymous';
    const movieTitleDiv = document.getElementById('movie-title');

    function togglePlayback() {
        if (!playing) {
            Promise.all([video.play().catch(()=>{}), audio.play().catch(()=>{})]).then(() => {
                playing = true; movieTitleDiv.style.display = 'none';
            });
        } else {
            video.pause(); audio.pause(); audio.currentTime = 0;
            playing = false; movieTitleDiv.style.display = 'block';
        }
    }

    function onScreenInteract(clientX, clientY) {
        const ray = new THREE.Raycaster();
        const mouse = new THREE.Vector2((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1);
        ray.setFromCamera(mouse, camera);
        if (ray.intersectObject(screen).length > 0) togglePlayback();
    }
    renderer.domElement.addEventListener('click', e => onScreenInteract(e.clientX, e.clientY));
    let touchStartX = 0, touchStartY = 0;
    renderer.domElement.addEventListener('touchstart', e => {
        if (e.touches.length === 1) { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }
    }, { passive: true });
    renderer.domElement.addEventListener('touchend', e => {
        if (e.changedTouches.length === 1) {
            const t = e.changedTouches[0];
            if (Math.abs(t.clientX - touchStartX) < 12 && Math.abs(t.clientY - touchStartY) < 12)
                onScreenInteract(t.clientX, t.clientY);
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        if (video.readyState >= video.HAVE_CURRENT_DATA) videoTexture.needsUpdate = true;

        ufoTime += 0.008;
        const heightWave = (Math.sin(ufoTime * 0.55) + 1) / 2;
        ufo.position.y = 2.2 + heightWave * 9;
        const ufoAngle = ufoTime * 0.45;
        ufo.position.x = Math.cos(ufoAngle) * 7;
        ufo.position.z = Math.sin(ufoAngle) * 6 + 2;
        ufo.rotation.y = -ufoAngle + Math.PI / 2;
        ufo.rotation.z = Math.sin(ufoTime * 0.9) * 0.08;
        beam.material.opacity = 0.15 + (1 - heightWave) * 0.2;
        ufoLights.forEach((l, i) => { l.scale.setScalar(0.8 + 0.5 * Math.sin(ufoTime * 7 + i)); });

        // Blue robot path (same route) — face from real movement so front (tray) leads
        blueTime += 0.004;
        const cycleLen = 48;
        const bt = blueTime % cycleLen;
        let bx, bz;
        if (bt < 14) {
            const p = bt / 14;
            bx = 14 - p * 28;
            bz = 10;
        } else if (bt < 24) {
            const p = (bt - 14) / 10;
            bx = -14;
            bz = 10 - p * 16;
        } else if (bt < 34) {
            const p = (bt - 24) / 10;
            bx = -14 + p * 14;
            bz = -6 + p * 6;
        } else {
            const p = (bt - 34) / 14;
            bx = 0 + p * 14;
            bz = 0 + p * 10;
        }
        const dx = bx - bluePrevX;
        const dz = bz - bluePrevZ;
        if (dx * dx + dz * dz > 1e-8) {
            // local +Z is front (eyes/tray) → point it along movement
            blueRobot.rotation.y = Math.atan2(dx, dz);
        }
        bluePrevX = bx;
        bluePrevZ = bz;
        blueRobot.position.x = bx;
        blueRobot.position.z = bz;
        blueRobot.position.y = 0;
        blueRobot.rotation.z = Math.sin(blueTime * 2) * 0.04;

        robotTime += 0.014;
        const cycle = Math.floor(robotTime / phaseDuration) % 3;
        const t = robotTime % phaseDuration;
        let targetX, targetZ, faceAngle;
        if (cycle === PHASE_CIRCLE) {
            const angle = (t / phaseDuration) * Math.PI * 2;
            targetX = robotCenterX + Math.cos(angle) * 6;
            targetZ = robotCenterZ + Math.sin(angle) * 6;
            faceAngle = -angle + Math.PI / 2;
        } else if (cycle === PHASE_FORWARD_BACK) {
            const progress = t / phaseDuration;
            targetX = robotCenterX;
            targetZ = robotCenterZ + Math.sin(progress * Math.PI * 2) * 7;
            faceAngle = Math.cos(progress * Math.PI * 2) < 0 ? Math.PI : 0;
        } else {
            const progress = t / phaseDuration;
            targetX = robotCenterX + Math.sin(progress * Math.PI * 2) * 8;
            targetZ = robotCenterZ;
            faceAngle = Math.cos(progress * Math.PI * 2) > 0 ? -Math.PI / 2 : Math.PI / 2;
        }
        robot.position.x = targetX;
        robot.position.z = targetZ;
        robot.rotation.y = faceAngle;
        robot.position.y = Math.abs(Math.sin(robotTime * 5)) * 0.1;
        robot.rotation.z = Math.sin(robotTime * 2.5) * 0.07;
        leftBlade.children.forEach((c, i) => { if (i > 0) c.rotation.x += 0.28; });
        rightBlade.children.forEach((c, i) => { if (i > 0) c.rotation.x += 0.28; });

        const dir = new THREE.Vector3();
        if (moveF) dir.z -= 1; if (moveB) dir.z += 1;
        if (moveL) dir.x -= 1; if (moveR) dir.x += 1;
        if (dir.length() > 0) {
            dir.normalize().applyQuaternion(camera.quaternion); dir.y = 0;
            camera.position.addScaledVector(dir, speed);
            camera.position.x = Math.max(-40, Math.min(40, camera.position.x));
            camera.position.z = Math.max(-5, Math.min(35, camera.position.z));
        }
        renderer.render(scene, camera);
    }
    animate();
    </script>
</body>
</html>
