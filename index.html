<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
    <title>Open Air Cinema</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            touch-action: none; 
        }
        #title, #movie-title {
            position: absolute; 
            left: 50%; 
            transform: translateX(-50%);
            color: #ffffff; 
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold; 
            text-shadow: 0 0 20px rgba(0,0,0,0.95), 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none; 
            z-index: 100;
            -webkit-text-stroke: 1.5px rgba(0,0,0,0.6);
            white-space: nowrap;
        }
        #title {
            top: 20px;
            font-size: 8.2vw;
            letter-spacing: 4px;
        }
        #movie-title {
            top: 95px;
            font-size: 5.2vw;
            letter-spacing: 2.5px;
        }
        #controls {
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            z-index: 100;
            display: grid; 
            grid-template-columns: 60px 60px 60px; 
            gap: 8px;
        }
        .btn {
            width: 60px; 
            height: 60px; 
            background: rgba(255,255,255,0.25);
            color: white; 
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 12px; 
            font-size: 32px; 
            display: flex;
            align-items: center; 
            justify-content: center;
        }
        canvas { 
            display: block; 
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>
    <div id="title">OPEN AIR CINEMA</div>
    <div id="movie-title">DANCE NOW</div>

    <div id="controls">
        <div></div><div class="btn" id="up">↑</div><div></div>
        <div class="btn" id="left">←</div>
        <div class="btn" id="down">↓</div>
        <div class="btn" id="right">→</div>
    </div>

    <script>
    const audioURL = "https://raw.githubusercontent.com/DJPetraDJP/CINEMA/main/signal.mp3";
    const videoURL = "https://raw.githubusercontent.com/DJPetraDJP/CINEMA/main/Ddjjpp.mp4";
    const picURL = "https://raw.githubusercontent.com/DJPetraDJP/CINEMA/main/DJPpic.jpg";

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x88aaff, 40, 180);

    const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 250);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    scene.background = new THREE.Color(0x88aaff);

    const sun = new THREE.DirectionalLight(0xffeecc, 1.2);
    sun.position.set(25, 60, 30);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xaaccff, 0.7));

    // Sand (larger for bigger room)
    const sand = new THREE.Mesh(new THREE.PlaneGeometry(200, 150), new THREE.MeshLambertMaterial({ color: 0xe0c090 }));
    sand.rotation.x = -Math.PI / 2;
    scene.add(sand);

    // Ocean, Trees, Sofas, Screen
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(80, 60), new THREE.MeshLambertMaterial({ color: 0x0088dd, transparent: true, opacity: 0.85 }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.set(-35, 0.2, -10);
    scene.add(ocean);

    function createPinkTree(x, z) {
        const group = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 7, 8), new THREE.MeshLambertMaterial({ color: 0x8B5A2B }));
        trunk.position.y = 3.5;
        const foliage = new THREE.Mesh(new THREE.SphereGeometry(4.5, 10, 10), new THREE.MeshLambertMaterial({ color: 0xff69b4 }));
        foliage.position.y = 9;
        group.add(trunk); group.add(foliage);
        group.position.set(x, 0, z);
        scene.add(group);
    }
    createPinkTree(-18, -15); createPinkTree(22, -18); createPinkTree(-25, 5);

    function createSofa(x, z) {
        const sofa = new THREE.Group();
        const base = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.8, 2.2), new THREE.MeshLambertMaterial({ color: 0xff69b4 }));
        base.position.y = 0.9; sofa.add(base);
        const back = new THREE.Mesh(new THREE.BoxGeometry(4.8, 1.8, 0.5), new THREE.MeshLambertMaterial({ color: 0xff4d94 }));
        back.position.set(0, 1.8, -0.8); sofa.add(back);
        sofa.rotation.y = Math.PI;
        sofa.position.set(x, 0, z);
        scene.add(sofa);
    }
    createSofa(-10, 12); createSofa(10, 13); createSofa(-12, 20); createSofa(12, 21); createSofa(0, 17);

    // ===== VIDEO LOOP ON SCREEN (Ddjjpp.mp4) — muted =====
    const video = document.createElement('video');
    video.src = videoURL;
    video.crossOrigin = 'anonymous';
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';

    const videoTexture = new THREE.VideoTexture(video);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;
    videoTexture.format = THREE.RGBFormat;

    const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(24, 13.5),
        new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide })
    );
    screen.position.set(0, 8.5, -32);
    scene.add(screen);

    // ===== RIGHT WALL + FRAMED DJPpic =====
    const wallMat = new THREE.MeshLambertMaterial({ color: 0xf5e6d3 });
    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.4, 16, 28), wallMat);
    rightWall.position.set(32, 8, 0);
    scene.add(rightWall);

    const baseboard = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.4, 28),
        new THREE.MeshLambertMaterial({ color: 0xddd0c0 })
    );
    baseboard.position.set(32, 0.2, 0);
    scene.add(baseboard);

    const pictureGroup = new THREE.Group();
    const frameOuter = new THREE.Mesh(
        new THREE.BoxGeometry(0.25, 7.2, 9.2),
        new THREE.MeshLambertMaterial({ color: 0x111111 })
    );
    pictureGroup.add(frameOuter);
    const frameInner = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 6.4, 8.4),
        new THREE.MeshLambertMaterial({ color: 0x2a2a2a })
    );
    frameInner.position.x = -0.05;
    pictureGroup.add(frameInner);
    const picGeo = new THREE.PlaneGeometry(7.6, 5.8);
    const picMat = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide });
    const picMesh = new THREE.Mesh(picGeo, picMat);
    picMesh.position.x = -0.15;
    pictureGroup.add(picMesh);
    const texLoader = new THREE.TextureLoader();
    texLoader.setCrossOrigin('anonymous');
    texLoader.load(picURL, function (tex) {
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        picMesh.material = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
        picMesh.material.needsUpdate = true;
    });
    pictureGroup.rotation.y = -Math.PI / 2;
    pictureGroup.position.set(31.7, 6.5, 4);
    scene.add(pictureGroup);

    // ===== ROUND PINK SOFAS WITH BLACK STRIPES (circle seating, right side) =====
    function createRoundSofa(x, z, rotY) {
        const g = new THREE.Group();
        const pink = new THREE.MeshLambertMaterial({ color: 0xff69b4 });
        const pinkDark = new THREE.MeshLambertMaterial({ color: 0xff4d94 });
        const black = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
        // curved-looking base (box segments feel roundish in circle layout)
        const seat = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.7, 1.8), pink);
        seat.position.y = 0.85;
        g.add(seat);
        // black stripe on seat
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(3.25, 0.12, 0.35), black);
        stripe.position.set(0, 1.22, 0.2);
        g.add(stripe);
        // backrest
        const back = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.5, 0.4), pinkDark);
        back.position.set(0, 1.7, -0.7);
        g.add(back);
        // black stripe on back
        const backStripe = new THREE.Mesh(new THREE.BoxGeometry(3.25, 0.2, 0.42), black);
        backStripe.position.set(0, 1.9, -0.7);
        g.add(backStripe);
        g.position.set(x, 0, z);
        g.rotation.y = rotY;
        scene.add(g);
    }
    // circle of 5 sofas facing center, on the right near the wall
    const sofaCircleCX = 24;
    const sofaCircleCZ = 2;
    const sofaCircleR = 5.5;
    for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        const sx = sofaCircleCX + Math.cos(a) * sofaCircleR;
        const sz = sofaCircleCZ + Math.sin(a) * sofaCircleR;
        // face toward circle center
        const rotY = a + Math.PI;
        createRoundSofa(sx, sz, rotY);
    }

    // ===== COLORFUL FLYING FISH (right side) =====
    const fishList = [];
    const fishColors = [0xff3366, 0x44ffaa, 0x4488ff, 0xffcc00, 0xff66ff, 0x00e5ff];
    function createFish(color) {
        const f = new THREE.Group();
        const mat = new THREE.MeshLambertMaterial({ color: color });
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 8), mat);
        body.scale.set(1.6, 0.7, 0.9);
        f.add(body);
        const tail = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.5, 6), mat);
        tail.rotation.z = Math.PI / 2;
        tail.position.x = -0.55;
        f.add(tail);
        const fin = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.3, 5), mat);
        fin.position.set(0, 0.25, 0);
        f.add(fin);
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), new THREE.MeshLambertMaterial({ color: 0xffffff }));
        eye.position.set(0.35, 0.08, 0.2);
        f.add(eye);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), new THREE.MeshLambertMaterial({ color: 0x111111 }));
        pupil.position.set(0.4, 0.08, 0.24);
        f.add(pupil);
        scene.add(f);
        return f;
    }
    for (let i = 0; i < 6; i++) {
        const fish = createFish(fishColors[i % fishColors.length]);
        fishList.push({
            mesh: fish,
            phase: Math.random() * Math.PI * 2,
            speed: 0.4 + Math.random() * 0.5,
            radius: 3 + Math.random() * 4,
            baseY: 2.5 + Math.random() * 4,
            cx: 22 + Math.random() * 6,
            cz: -4 + Math.random() * 10
        });
    }

    // ===== BLUE ROBOT WITH TRAY (right corner, runs around) =====
    const blueRobot = new THREE.Group();
    const blueMat = new THREE.MeshLambertMaterial({ color: 0x3399ff });
    const blueDark = new THREE.MeshLambertMaterial({ color: 0x2266cc });
    const bBody = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.4, 0.7), blueMat);
    bBody.position.y = 1.5;
    blueRobot.add(bBody);
    const bHead = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.85, 0.75), blueMat);
    bHead.position.y = 2.55;
    blueRobot.add(bHead);
    function makeBlueEye(x) {
        const eg = new THREE.Group();
        const w = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), new THREE.MeshLambertMaterial({ color: 0xffffff }));
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), new THREE.MeshLambertMaterial({ color: 0x111111 }));
        p.position.z = 0.14;
        eg.add(w); eg.add(p);
        eg.position.set(x, 2.6, 0.38);
        blueRobot.add(eg);
    }
    makeBlueEye(-0.22); makeBlueEye(0.22);
    const bAnt = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.35, 6), blueDark);
    bAnt.position.y = 3.15;
    blueRobot.add(bAnt);
    const bAntBall = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshBasicMaterial({ color: 0x66ffff }));
    bAntBall.position.y = 3.35;
    blueRobot.add(bAntBall);
    const bArmL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.25), blueDark);
    bArmL.position.set(-0.75, 1.6, 0);
    blueRobot.add(bArmL);
    const bArmR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.25), blueDark);
    bArmR.position.set(0.75, 1.6, 0);
    blueRobot.add(bArmR);
    const bTray = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 1.0), new THREE.MeshLambertMaterial({ color: 0xeeeeee }));
    bTray.position.set(0, 1.95, 0.7);
    blueRobot.add(bTray);
    // tasty items on tray: cakes / fruits / snacks
    const treatColors = [0xff6688, 0xffcc44, 0x88ffaa, 0xff8844, 0xcc88ff];
    for (let i = 0; i < 5; i++) {
        const treat = new THREE.Mesh(
            new THREE.CylinderGeometry(0.14, 0.16, 0.2, 10),
            new THREE.MeshLambertMaterial({ color: treatColors[i] })
        );
        treat.position.set(-0.5 + i * 0.25, 2.12, 0.55);
        blueRobot.add(treat);
        // frosting top
        const top = new THREE.Mesh(
            new THREE.SphereGeometry(0.1, 8, 8),
            new THREE.MeshLambertMaterial({ color: 0xffffff })
        );
        top.position.set(-0.5 + i * 0.25, 2.25, 0.55);
        top.scale.y = 0.5;
        blueRobot.add(top);
    }
    // ice cream cone
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.35, 8), new THREE.MeshLambertMaterial({ color: 0xe8b060 }));
    cone.position.set(0.5, 2.2, 0.85);
    cone.rotation.x = Math.PI;
    blueRobot.add(cone);
    const scoop = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 10), new THREE.MeshLambertMaterial({ color: 0xff99cc }));
    scoop.position.set(0.5, 2.42, 0.85);
    blueRobot.add(scoop);
    const bLegL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.35), blueDark);
    bLegL.position.set(-0.3, 0.7, 0);
    blueRobot.add(bLegL);
    const bLegR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.35), blueDark);
    bLegR.position.set(0.3, 0.7, 0);
    blueRobot.add(bLegR);
    // simple roller feet
    const bWheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    for (const wx of [-0.3, 0.3]) {
        for (let wi = 0; wi < 3; wi++) {
            const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.08, 8), bWheelMat);
            wh.rotation.z = Math.PI / 2;
            wh.position.set(wx, 0.1, -0.2 + wi * 0.2);
            blueRobot.add(wh);
        }
    }
    blueRobot.position.set(26, 0, -6);
    scene.add(blueRobot);
    let blueRobotTime = 0;
    const blueCenterX = 25;
    const blueCenterZ = -2;

    camera.position.set(0, 6, 25);

    // ===== PINK UFO =====
    const ufo = new THREE.Group();
    const ufoPink = new THREE.MeshLambertMaterial({ color: 0xff66aa });
    const ufoPinkDark = new THREE.MeshLambertMaterial({ color: 0xee4488 });
    const ufoDomeMat = new THREE.MeshLambertMaterial({ color: 0xffccee, transparent: true, opacity: 0.9 });
    const ufoLightMat = new THREE.MeshBasicMaterial({ color: 0xffff66 });
    const saucer = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 4.0, 0.55, 28), ufoPink);
    ufo.add(saucer);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(4.0, 4.3, 0.25, 28), ufoPinkDark);
    rim.position.y = -0.35;
    ufo.add(rim);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(1.6, 18, 14, 0, Math.PI * 2, 0, Math.PI / 2), ufoDomeMat);
    dome.position.y = 0.28;
    ufo.add(dome);
    const ufoAnt = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.7, 6), new THREE.MeshLambertMaterial({ color: 0xff99cc }));
    ufoAnt.position.y = 1.9;
    ufo.add(ufoAnt);
    const ufoAntBall = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffee55 }));
    ufoAntBall.position.y = 2.3;
    ufo.add(ufoAntBall);
    const ufoLights = [];
    for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        const light = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), ufoLightMat);
        light.position.set(Math.cos(a) * 3.6, -0.5, Math.sin(a) * 3.6);
        ufo.add(light);
        ufoLights.push(light);
    }
    const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 1.8, 3.5, 16, 1, true),
        new THREE.MeshBasicMaterial({ color: 0xffaadd, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
    );
    beam.position.y = -2.2;
    ufo.add(beam);
    ufo.position.set(0, 2.5, 0);
    scene.add(ufo);
    let ufoTime = 0;

    // ===== PINK-RED ROLLERBLADE ROBOT WITH TRAY (original) =====
    const robot = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0xff3366 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.4, 0.7), bodyMat);
    body.position.y = 1.5;
    robot.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.85, 0.75), bodyMat);
    head.position.y = 2.55;
    robot.add(head);
    const eyeWhiteMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const eyePupilMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    function makeEye(x) {
        const eyeGroup = new THREE.Group();
        const white = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), eyeWhiteMat);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 10), eyePupilMat);
        pupil.position.z = 0.14;
        eyeGroup.add(white);
        eyeGroup.add(pupil);
        eyeGroup.position.set(x, 2.6, 0.38);
        robot.add(eyeGroup);
        return eyeGroup;
    }
    makeEye(-0.22);
    makeEye(0.22);
    const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.35, 6), new THREE.MeshLambertMaterial({ color: 0xff6699 }));
    antenna.position.y = 3.15;
    robot.add(antenna);
    const antennaBall = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshLambertMaterial({ color: 0xffcc00 }));
    antennaBall.position.y = 3.35;
    robot.add(antennaBall);
    const armMat = new THREE.MeshLambertMaterial({ color: 0xff4477 });
    const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.25), armMat);
    leftArm.position.set(-0.75, 1.6, 0);
    robot.add(leftArm);
    const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.25), armMat);
    rightArm.position.set(0.75, 1.6, 0);
    robot.add(rightArm);
    const tray = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 0.08, 1.0),
        new THREE.MeshLambertMaterial({ color: 0xdddddd })
    );
    tray.position.set(0, 1.95, 0.7);
    robot.add(tray);
    const glassColors = [0xff4444, 0x44ff88, 0x4488ff, 0xffaa00, 0xff66cc];
    for (let i = 0; i < 5; i++) {
        const glass = new THREE.Mesh(
            new THREE.CylinderGeometry(0.12, 0.1, 0.35, 10),
            new THREE.MeshLambertMaterial({ color: glassColors[i], transparent: true, opacity: 0.85 })
        );
        glass.position.set(-0.55 + i * 0.28, 2.18, 0.55);
        robot.add(glass);
        const liquid = new THREE.Mesh(
            new THREE.CylinderGeometry(0.09, 0.09, 0.04, 8),
            new THREE.MeshLambertMaterial({ color: glassColors[i] })
        );
        liquid.position.set(-0.55 + i * 0.28, 2.28, 0.55);
        robot.add(liquid);
    }
    const bowl = new THREE.Mesh(
        new THREE.CylinderGeometry(0.28, 0.22, 0.18, 12),
        new THREE.MeshLambertMaterial({ color: 0xf5d0a0 })
    );
    bowl.position.set(0.45, 2.12, 0.85);
    robot.add(bowl);
    const chipMat = new THREE.MeshLambertMaterial({ color: 0xffcc44 });
    for (let i = 0; i < 8; i++) {
        const chip = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.025, 8), chipMat);
        const angle = (i / 8) * Math.PI * 2;
        chip.position.set(
            0.45 + Math.cos(angle) * 0.12,
            2.22 + (i % 3) * 0.03,
            0.85 + Math.sin(angle) * 0.12
        );
        chip.rotation.x = Math.random() * 0.5;
        chip.rotation.z = Math.random() * 0.5;
        robot.add(chip);
    }
    const legMat = new THREE.MeshLambertMaterial({ color: 0xee2255 });
    const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.35), legMat);
    leftLeg.position.set(-0.3, 0.7, 0);
    robot.add(leftLeg);
    const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.35), legMat);
    rightLeg.position.set(0.3, 0.7, 0);
    robot.add(rightLeg);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const bootMat = new THREE.MeshLambertMaterial({ color: 0xff6699 });
    function makeRollerblade(x) {
        const blade = new THREE.Group();
        const boot = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.25, 0.7), bootMat);
        boot.position.y = 0.15;
        blade.add(boot);
        for (let i = 0; i < 4; i++) {
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.08, 10), wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(0, -0.05, -0.25 + i * 0.18);
            blade.add(wheel);
        }
        blade.position.set(x, 0.1, 0);
        robot.add(blade);
        return blade;
    }
    const leftBlade = makeRollerblade(-0.3);
    const rightBlade = makeRollerblade(0.3);
    robot.position.set(5, 0, 8);
    scene.add(robot);

    let robotTime = 0;
    const robotCenterX = 5;
    const robotCenterZ = 8;
    const PHASE_CIRCLE = 0;
    const PHASE_FORWARD_BACK = 1;
    const PHASE_LEFT_RIGHT = 2;
    const phaseDuration = 8;

    // Controls
    let yaw = 0, isDragging = false, prevX = 0;
    renderer.domElement.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
            isDragging = true;
            prevX = e.touches[0].clientX;
        }
    });
    renderer.domElement.addEventListener('touchmove', e => {
        if (isDragging) {
            yaw -= (e.touches[0].clientX - prevX) * 0.0038;
            camera.rotation.set(0, yaw, 0);
            prevX = e.touches[0].clientX;
        }
    });
    renderer.domElement.addEventListener('touchend', () => isDragging = false);

    let moveF = false, moveB = false, moveL = false, moveR = false;
    const speed = 0.24;

    function btn(id, dir) {
        document.getElementById(id).addEventListener('touchstart', e => { e.preventDefault(); dir(true); });
        document.getElementById(id).addEventListener('touchend', e => { e.preventDefault(); dir(false); });
    }
    btn('up', v => moveF = v);
    btn('down', v => moveB = v);
    btn('left', v => moveL = v);
    btn('right', v => moveR = v);

    let playing = false;
    const audio = new Audio();
    audio.src = audioURL;
    audio.loop = true;
    audio.preload = "auto";
    audio.crossOrigin = "anonymous";

    const movieTitleDiv = document.getElementById('movie-title');

    function togglePlayback() {
        if (!playing) {
            const playVideo = video.play();
            const playAudio = audio.play();
            Promise.all([
                playVideo !== undefined ? playVideo : Promise.resolve(),
                playAudio !== undefined ? playAudio : Promise.resolve()
            ]).then(() => {
                playing = true;
                movieTitleDiv.style.display = 'none';
            }).catch(err => {
                console.error("Play failed:", err);
                video.play().then(() => {
                    playing = true;
                    movieTitleDiv.style.display = 'none';
                    audio.play().catch(() => {});
                }).catch(e => console.error("Retry failed:", e));
            });
        } else {
            video.pause();
            audio.pause();
            audio.currentTime = 0;
            playing = false;
            movieTitleDiv.style.display = 'block';
        }
    }

    function onScreenInteract(clientX, clientY) {
        const ray = new THREE.Raycaster();
        const mouse = new THREE.Vector2(
            (clientX / window.innerWidth) * 2 - 1,
            -(clientY / window.innerHeight) * 2 + 1
        );
        ray.setFromCamera(mouse, camera);
        if (ray.intersectObject(screen).length > 0) {
            togglePlayback();
        }
    }

    renderer.domElement.addEventListener('click', e => {
        onScreenInteract(e.clientX, e.clientY);
    });

    let touchStartX = 0, touchStartY = 0;
    renderer.domElement.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', e => {
        if (e.changedTouches.length === 1) {
            const touch = e.changedTouches[0];
            const dx = Math.abs(touch.clientX - touchStartX);
            const dy = Math.abs(touch.clientY - touchStartY);
            if (dx < 12 && dy < 12) {
                onScreenInteract(touch.clientX, touch.clientY);
            }
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);

        if (video.readyState >= video.HAVE_CURRENT_DATA) {
            videoTexture.needsUpdate = true;
        }

        // UFO (unchanged)
        ufoTime += 0.008;
        const heightWave = (Math.sin(ufoTime * 0.55) + 1) / 2;
        ufo.position.y = 2.2 + heightWave * 9;
        const ufoAngle = ufoTime * 0.45;
        ufo.position.x = Math.cos(ufoAngle) * 7;
        ufo.position.z = Math.sin(ufoAngle) * 6 + 2;
        ufo.rotation.y = -ufoAngle + Math.PI / 2;
        ufo.rotation.z = Math.sin(ufoTime * 0.9) * 0.08;
        beam.material.opacity = 0.15 + (1 - heightWave) * 0.2;
        ufoLights.forEach((l, i) => {
            l.scale.setScalar(0.8 + 0.5 * Math.sin(ufoTime * 7 + i));
        });

        // Flying fish (right side)
        fishList.forEach((f, i) => {
            const t = ufoTime * f.speed + f.phase;
            f.mesh.position.x = f.cx + Math.cos(t) * f.radius;
            f.mesh.position.z = f.cz + Math.sin(t) * f.radius * 0.7;
            f.mesh.position.y = f.baseY + Math.sin(t * 2) * 0.8;
            f.mesh.rotation.y = -t + Math.PI / 2;
            f.mesh.rotation.z = Math.sin(t * 3) * 0.25;
        });

        // Blue robot runs in a corner loop (right side)
        blueRobotTime += 0.016;
        const ba = blueRobotTime;
        blueRobot.position.x = blueCenterX + Math.cos(ba) * 4;
        blueRobot.position.z = blueCenterZ + Math.sin(ba) * 3.5;
        blueRobot.position.y = Math.abs(Math.sin(blueRobotTime * 6)) * 0.12;
        blueRobot.rotation.y = -ba + Math.PI / 2;
        blueRobot.rotation.z = Math.sin(blueRobotTime * 3) * 0.06;

        // Original pink robot (unchanged)
        robotTime += 0.014;
        const cycle = Math.floor(robotTime / phaseDuration) % 3;
        const t = robotTime % phaseDuration;
        let targetX, targetZ, faceAngle;
        if (cycle === PHASE_CIRCLE) {
            const angle = (t / phaseDuration) * Math.PI * 2;
            const radius = 6;
            targetX = robotCenterX + Math.cos(angle) * radius;
            targetZ = robotCenterZ + Math.sin(angle) * radius;
            faceAngle = -angle + Math.PI / 2;
        } else if (cycle === PHASE_FORWARD_BACK) {
            const progress = t / phaseDuration;
            const zOffset = Math.sin(progress * Math.PI * 2) * 7;
            targetX = robotCenterX;
            targetZ = robotCenterZ + zOffset;
            const movingForward = Math.cos(progress * Math.PI * 2) < 0;
            faceAngle = movingForward ? Math.PI : 0;
        } else {
            const progress = t / phaseDuration;
            const xOffset = Math.sin(progress * Math.PI * 2) * 8;
            targetX = robotCenterX + xOffset;
            targetZ = robotCenterZ;
            const movingRight = Math.cos(progress * Math.PI * 2) > 0;
            faceAngle = movingRight ? -Math.PI / 2 : Math.PI / 2;
        }
        robot.position.x = targetX;
        robot.position.z = targetZ;
        robot.rotation.y = faceAngle;
        robot.position.y = Math.abs(Math.sin(robotTime * 5)) * 0.1;
        robot.rotation.z = Math.sin(robotTime * 2.5) * 0.07;
        leftBlade.children.forEach((c, i) => {
            if (i > 0) c.rotation.x += 0.28;
        });
        rightBlade.children.forEach((c, i) => {
            if (i > 0) c.rotation.x += 0.28;
        });

        const dir = new THREE.Vector3();
        if (moveF) dir.z -= 1;
        if (moveB) dir.z += 1;
        if (moveL) dir.x -= 1;
        if (moveR) dir.x += 1;
        if (dir.length() > 0) {
            dir.normalize().applyQuaternion(camera.quaternion);
            dir.y = 0;
            camera.position.addScaledVector(dir, speed);
            camera.position.x = Math.max(-40, Math.min(48, camera.position.x));
            camera.position.z = Math.max(-5, Math.min(35, camera.position.z));
        }
        renderer.render(scene, camera);
    }
    animate();
    </script>
</body>
</html>
